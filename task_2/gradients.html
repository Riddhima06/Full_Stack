<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        width: 100%;
        height: 100%;
      }
      .gradient1 {
        width: 500px;
        height: 500px;
      }
      #box1 {
        background: linear-gradient(127deg, orange, purple, black);
      }
      #box2 {
        background: radial-gradient(orange, yellow, white);
        border-radius: 1000000px;
      }
      #box3 {
        background: conic-gradient(red, black, white);
        border-radius: 1000000px;
        box-shadow: 0px 0px 20px 10px black;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="gradient1" id="box1">
        <p></p>
      </div>
      <div class="gradient1" id="box2">
        <p></p>
      </div>
      <div class="gradient1" id="box3">
        <p></p>
      </div>
    </div>
  </body>
</html>
