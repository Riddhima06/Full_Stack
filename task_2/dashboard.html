<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Dashboard</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
      }

      .container {
        display: flex;
        height: 100vh;
      }
      .sidebar {
        width: 220px;
        background: #555;
        color: white;
        padding: 20px;
      }
      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 10px;
        background: #f4f4f4;
      }
      .navbar {
        padding: 15px;
        margin-bottom: 10px;
        border-radius: 5px;
      }
      .cards {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
      }

      .card {
        flex: 1;
        padding: 30px;
        text-align: center;
        border-radius: 5px;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        background: white;
      }

      .th,
      .td {
        border: 1px solid #ccc;
        padding: 10px;
        text-align: center;
      }

      .th {
        background: #ddd;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- Sidebar -->
      <div class="sidebar">
        <h2>Sidebar</h2>
        <p>1</p>
        <p>2</p>
        <p>3</p>
      </div>

      <div class="content">
        <div class="navbar">
          <h2>Navbar</h2>
        </div>
        <div class="cards">
          <div class="card">Card 1</div>
          <div class="card">Card 2</div>
          <div class="card">Card 3</div>
        </div>

        <table>
          <thead>
            <tr>
              <th>1</th>
              <th>2</th>
              <th>3</th>
              <th>4</th>
            </tr>
          </thead>
        </table>
      </div>
    </div>
  </body>
</html>
