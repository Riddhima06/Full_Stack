<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      :root {
        --primary-color: grey;
        --text-size: 30px;
      }
      .container {
        background-color: var(--primary-color);
        height: 500px;
        width: 500px;
        display: grid;
        /* grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        grid-template-rows: repeat(3, 1fr); */
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr 1fr;
        outline: 1px solid black;
        /* grid-template-areas:
          "box1 box1 box2"
          "box1 box1 box3"
          "box4 box5 box6"; */
      }
      .container > div {
        font-size: calc(var(--text-size) * 2);
        font-size: 30px;
        outline: 1px dashed black;
      }
      /* #box1 {
        background-color:white;
        grid-column-start: 1;
        grid-column-end: 3;
        grid-row-start: 1;
        grid-row-end: 3;
        z-index: 1;
      }
      #box6 {
        background-color: grey;
        grid-column-start: 2;
        grid-row-start: 3;
        grid-row-end: 3;
        grid-row-start: 2;
        z-index: 2;
      } */
      .parent {
        --primary-color: black;
        background-color: red;
        grid-template-columns: subgrid;
        grid-template-rows: subgrid;
        grid-column: 1/3;
        grid-row: 1/3;
      }
      .child {
        --primary-color: white;
        background-color: black;
        color: white;
        grid-column: 2/3;
        grid-row: 2/3;
      }
    </style>
  </head>
  <body>

      <div id="box3" style="grid-area: box3">3</div>
      <div id="box4" style="grid-area: box4">4</div>
      <div id="box5" style="grid-area: box5">5</div>
      <div id="box6" style="grid-area: box6">6</div>
    </div> -->

    <div class="container">
      <div class="parent">
        <div class="child">1</div>
      </div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
    </div>
  </body>
</html>
