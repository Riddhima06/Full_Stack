<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        height: 90vh;
        display: inline-flex;
      }
      .box {
        width: 90vw;
        height: 90vh;
        color: white;
        font-size: 30px;
        font-weight: bold;
        text-align: center;
        position: sticky;
        left: 1%;
        text-shadow: 2px 2px 4px grey;
        font-family: "Rubik Spray Paint", system-ui;
      }
      #box0 {
        background-image: url("https://picsum.photos/id/15/1800/800");
      }

      #box1 {
        background-image: url("https://picsum.photos/id/16/1800/800");
      }
      #box2 {
        background-image: url("https://picsum.photos/id/17/1800/800");
      }
      #box3 {
        background-image: url("https://picsum.photos/id/18/1800/800");
      }
      #box4 {
        background-image: url("https://picsum.photos/id/19/1800/800");
      }
      #box5 {
        background-image: url("https://picsum.photos/id/25/1800/800");
      }
      #linear-gradient {
        background: linear-gradient(to right, purple, black);
      }
      .lg {
        width: 80%;
        height: 90%;
        border-radius: inherit;
        background: linear-gradient(to right, orange, yellow, white);
      }
    </style>
  </head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Rubik+Spray+Paint&display=swap"
    rel="stylesheet"
  />

  <body>
    <div class="container">
      <div class="box" id="box0">
        <p>ENVIRONMENT CLICKS</p>
      </div>
      <div class="box" id="box1">
        <p>Nature does not hurry, yet everything is accomplished</p>
      </div>
      <div class="box" id="box2">
        <p>Adopt the pace of nature. Her secret is patience</p>
      </div>
      <div class="box" id="box3">
        <p>The earth has its music for those who will listen</p>
      </div>
      <div class="box" id="box4">
        <p>In every walk with nature, one receives far more than he seeks</p>
      </div>
      <div class="box" id="box5">
        <p></p>
      </div>
      <div class="box" id="linear-gradient">
        <p></p>
      </div>
    </div>
    <div class="lg">
      <p>steps count</p>
    </div>
  </body>
</html>
