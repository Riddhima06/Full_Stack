<!doctype html>
<html>
  <head>
    <title>Bento Box</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f2f2;
      }

      h1 {
        text-align: center;
        margin: 30px;
      }

      .bento {
        width: 90%;
        max-width: 1000px;
        margin: auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: 180px 180px 180px;
        gap: 15px;
      }

      .box {
        background: white;
        border-radius: 15px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .one {
        grid-column: span 2;
        grid-row: span 2;
        background: #ff6b6b;
      }

      .two {
        grid-column: span 2;
        background: #4dabf7;
      }

      .three {
        background: #51cf66;
      }

      .four {
        background: #ffd43b;
      }

      .five {
        grid-column: span 2;
        background: #b197fc;
      }

      .six {
        background: #ffa94d;
      }

      h2 {
        margin: 0 0 10px;
      }

      p {
        margin: 0;
      }
    </style>
  </head>

  <body>
    <h1>My Bento Dashboard</h1>

    <div class="bento">
      <div class="box one">
        <h2>Welcome 👋</h2>
        <p>This is the main section of my dashboard.</p>
      </div>

      <div class="box two">
        <h2>Projects</h2>
        <p>6 active projects</p>
      </div>

      <div class="box three">
        <h2>Tasks</h2>
        <p>12 tasks</p>
      </div>

      <div class="box four">
        <h2>Progress</h2>
        <p>75%</p>
      </div>

      <div class="box five">
        <h2>Learning</h2>
        <p>Currently learning Web Development</p>
      </div>

      <div class="box six">
        <h2>Profile</h2>
        <p>Student</p>
      </div>
    </div>
  </body>
</html>
